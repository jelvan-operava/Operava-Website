<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ente Features Banner - High Movement Hanging Animation</title>
    <!-- Importing Lucide Icons for the feature graphics -->
    <script src="https://unpkg.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Bright Green Container */
        .banner-container {
            background-color: #12b12a; /* Ente's vibrant signature green */
            width: 100%;
            max-width: 1000px;
            border-radius: 24px;
            padding: 40px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Grid wrapper for the hanging elements */
        .features-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        /* Individual feature node anchor */
        .feature-node {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px; 
            width: 105px;
        }

        /* The Hanging String Line */
        .feature-node::before {
            content: '';
            position: absolute;
            top: -40px;
            left: 50%;
            width: 1px;
            height: 80px;
            background-color: rgba(0, 0, 0, 0.4);
            transform: translateX(-50%);
            z-index: 1;
        }

        /* The Black Card Content Block */
        .feature-card {
            background-color: #111111;
            color: #ffffff;
            border-radius: 16px;
            padding: 16px 10px;
            width: 100%;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            
            /* Hinging transform origin from the very top center */
            transform-origin: top center;
            
            /* Continuous animation sequence loop */
            animation: heavySwing 2.8s ease-in-out infinite;
        }

        /* 
           STAGGERING TIMINGS
           Asymmetric delay pacing to simulate an irregular, chaotic physical environment.
        */
        .features-grid .feature-node:nth-child(1) .feature-card { animation-delay: 0.0s; }
        .features-grid .feature-node:nth-child(2) .feature-card { animation-delay: 0.5s; }
        .features-grid .feature-node:nth-child(3) .feature-card { animation-delay: 1.1s; }
        .features-grid .feature-node:nth-child(4) .feature-card { animation-delay: 0.3s; }
        .features-grid .feature-node:nth-child(5) .feature-card { animation-delay: 1.6s; }
        .features-grid .feature-node:nth-child(6) .feature-card { animation-delay: 0.8s; }

        /* Custom Icon Styling */
        .feature-icon {
            color: #ffffff;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        /* Text Label Styling */
        .feature-label {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.2;
            word-wrap: break-word;
        }

        /* Bottom Text Accent */
        .footer-text {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            align-self: flex-end;
            margin-right: 20px;
            opacity: 0.95;
        }

        /* 
           HIGH MOVEMENT LOOPS
           Increased maximum rotation angle values to create a highly visible rocking motion.
        */
        @keyframes heavySwing {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }   /* Distinct rightward slant */
            50% { transform: rotate(0deg); }    /* Rapid gravitational drop */
            75% { transform: rotate(-15deg); }  /* Distinct leftward slant */
            100% { transform: rotate(0deg); }   /* Smooth integration loop reset */
        }
    </style>
</head>
<body>

    <div class="banner-container">
        
        <div class="features-grid">
            
            <!-- Card 1 -->
            <div class="feature-node">
                <div class="feature-card">
                    <i data-lucide="download" class="feature-icon" stroke-width="2.5" size="20"></i>
                    <div class="feature-label">Easy<br>Import</div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="feature-node">
                <div class="feature-card">
                    <i data-lucide="upload" class="feature-icon" stroke-width="2.5" size="20"></i>
                    <div class="feature-label">Easier<br>Export</div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="feature-node">
                <div class="feature-card">
                    <i data-lucide="sparkles" class="feature-icon" stroke-width="2.5" size="20"></i>
                    <div class="feature-label">Smart<br>Albums</div>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="feature-node">
                <div class="feature-card">
                    <i data-lucide="message-square-heart" class="feature-icon" stroke-width="2.5" size="20"></i>
                    <div class="feature-label">Comments<br>& Likes</div>
                </div>
            </div>

            <!-- Card 5 -->
            <div class="feature-node">
                <div class="feature-card">
                    <i data-lucide="eye-off" class="feature-icon" stroke-width="2.5" size="20"></i>
                    <div class="feature-label">Hidden<br>Photos</div>
                </div>
            </div>

            <!-- Card 6 -->
            <div class="feature-node">
                <div class="feature-card">
                    <i data-lucide="shield-alert" class="feature-icon" stroke-width="2.5" size="20"></i>
                    <div class="feature-label">Legacy<br>Contacts</div>
                </div>
            </div>

        </div>

        <div class="footer-text">and a lot more!</div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
